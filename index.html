<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoDesk — Estação Geoespacial</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0c10;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .pre-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        width: 100%;
        background: #0a0c10;
      }
      .pre-splash-box {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.22);
        margin-bottom: 16px;
      }
      .pre-splash-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: #f8fafc;
        margin-bottom: 4px;
      }
      .pre-splash-sub {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #94a3b8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-splash">
        <div class="pre-splash-box">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
        </div>
        <div class="pre-splash-title">GeoDesk</div>
        <div class="pre-splash-sub">Iniciando aplicação...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
