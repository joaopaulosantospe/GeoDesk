<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>GeoDesk — Splash</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* Cartão central — mesmo visual da splash original */
      .splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 460px;
        padding: 36px 32px 28px;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 14px;
        box-shadow: 0 20px 45px -8px rgba(15, 23, 42, 0.28), 0 8px 18px -4px rgba(15, 23, 42, 0.12);
        animation: cardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      }

      body.fade-out .splash-card {
        transform: scale(0.96);
        opacity: 0;
      }

      @keyframes cardIn {
        from {
          transform: scale(0.96);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* Emblema com moldura geométrica */
      .emblem-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }

      .orbit-ring {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1.5px dashed rgba(37, 99, 235, 0.25);
        animation: spin 16s linear infinite;
      }

      .orbit-dot {
        position: absolute;
        top: 1px;
        left: 50%;
        width: 6px;
        height: 6px;
        background: #2563eb;
        border-radius: 50%;
        transform: translateX(-50%);
      }

      .emblem {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
      }

      /* Títulos da marca */
      .title-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 4px;
      }

      .brand-title {
        font-size: 28px;
        font-weight: 750;
        letter-spacing: -0.5px;
        color: #0f172a;
        margin: 0;
      }

      .version-tag {
        font-size: 11px;
        font-weight: 600;
        color: #1d4ed8;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        padding: 2px 7px;
        border-radius: 999px;
        letter-spacing: 0.3px;
      }

      .subtitle {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #64748b;
        font-weight: 600;
        margin: 0 0 24px;
      }

      /* Barra de progresso */
      .progress-track {
        width: 290px;
        height: 6px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 12px;
      }

      .progress-bar {
        height: 100%;
        width: 0;
        background: #2563eb;
        border-radius: 999px;
        transition: width 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Mensagem de status */
      .status-text {
        font-size: 12px;
        color: #475569;
        min-height: 18px;
        font-weight: 500;
        letter-spacing: 0.1px;
      }

      /* Rodapé */
      .card-footer {
        width: 100%;
        margin-top: 24px;
        padding-top: 14px;
        border-top: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11.5px;
        color: #64748b;
      }

      .footer-badge {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 500;
      }

      .status-led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #16a34a;
      }

      .skip-btn {
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 500;
        color: #475569;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        transition: all 0.15s ease;
      }

      .skip-btn:hover {
        background: #f8fafc;
        color: #0f172a;
        border-color: #94a3b8;
      }

      .skip-btn:active {
        transform: translateY(1px);
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-card">
      <div class="emblem-wrap">
        <div class="orbit-ring">
          <div class="orbit-dot"></div>
        </div>
        <div class="emblem">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
            <path d="M2 12h20"></path>
          </svg>
        </div>
      </div>

      <div class="title-row">
        <h1 class="brand-title">GeoDesk</h1>
        <span class="version-tag" id="versionTag">v1.0.0</span>
      </div>

      <div class="subtitle">Estação de Trabalho Geoespacial</div>
      <div style="font-size: 11px; color: #64748b; margin-top: 3px; font-weight: 500;">Licenciado para João Paulo Santos</div>

      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="status-text" id="statusText"></div>

      <div class="card-footer">
        <div class="footer-badge">
          <span class="status-led"></span>
          <span>Motor Cartográfico Ativo</span>
        </div>
        <button type="button" class="skip-btn" id="skipBtn">Pular</button>
      </div>
    </div>

    <script>
      // Versão exibida no cartão: vem do processo main via query string
      // (?v=1.3.1) — nunca hardcoded. Sem a query, o tag é ocultado para
      // não exibir uma versão errada.
      (function () {
        var tag = document.getElementById('versionTag');
        var v = new URLSearchParams(window.location.search).get('v');
        if (v) {
          tag.textContent = 'v' + v;
        } else {
          tag.style.display = 'none';
        }
      })();

      var STEPS = [
        { at: 15, text: 'Inicializando ambiente geoespacial…' },
        { at: 42, text: 'Carregando projeções cartográficas e CRS…' },
        { at: 72, text: 'Configurando renderizador OpenLayers…' },
        { at: 92, text: 'Preparando ferramentas de análise e exportação…' },
        { at: 100, text: 'Pronto! Iniciando workspace…' },
      ];

      var progressBar = document.getElementById('progressBar');
      var statusText = document.getElementById('statusText');
      var skipBtn = document.getElementById('skipBtn');
      var finished = false;

      function finish() {
        if (finished) return;
        finished = true;
        clearInterval(interval);
        progressBar.style.width = '100%';
        statusText.textContent = STEPS[STEPS.length - 1].text;
        document.body.classList.add('fade-out');
        // Fecha a janela de splash e revela a janela principal (via processo main).
        setTimeout(function () {
          if (window.splashAPI && typeof window.splashAPI.done === 'function') {
            window.splashAPI.done();
          } else {
            window.close();
          }
        }, 350);
      }

      skipBtn.addEventListener('click', finish);

      var current = 0;
      statusText.textContent = STEPS[0].text;
      var interval = setInterval(function () {
        current += Math.random() < 0.65 ? 1 : 2;
        if (current >= 100) {
          current = 100;
          clearInterval(interval);
          // Mostra "Pronto!" em 100% antes de encerrar.
          setTimeout(finish, 550);
        }
        progressBar.style.width = current + '%';
        var steps = STEPS.slice().reverse();
        for (var i = 0; i < steps.length; i++) {
          if (current >= steps[i].at) {
            statusText.textContent = steps[i].text;
            break;
          }
        }
      }, 45);
    </script>
  </body>
</html>
